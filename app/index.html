<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f4f5f9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0d16" media="(prefers-color-scheme: dark)">
  <meta name="description" content="Job Tracker: разбор вакансии по ссылке, заявки и статусы с телефона">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>Job Tracker</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#add" aria-label="Job Tracker"><span class="logo" aria-hidden="true">JT</span><span>Job Tracker</span></a>
    <span class="net" id="net" hidden>офлайн</span>
    <button class="icon-btn" id="openSetup" aria-label="Настройки"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7Zm7.4-2.5a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.3 2.9a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1c.5.4 1.1.7 1.7 1L11 21h4l.3-2.9c.6-.3 1.2-.6 1.7-1l2.5 1 2-3.5-2.1-1.6Z"/></svg></button>
  </header>

  <main id="view" class="view" aria-live="polite"></main>

  <nav class="tabs" aria-label="Разделы">
    <a href="#add" data-tab="add"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg><span>Разбор</span></a>
    <a href="#list" data-tab="list"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg><span>Заявки</span><b class="cnt" id="cntList"></b></a>
    <a href="#today" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="2.2" fill="none"/><path d="M12 7.5V12l3 2" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg><span>Сегодня</span><b class="cnt" id="cntToday"></b></a>
  </nav>

  <div class="sheet-scrim" id="scrim" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" hidden></section>
  <div class="toast" id="toast" role="status" hidden></div>

  <script src="lib/quality.js"></script>
  <script src="lib/analyzer.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/extract.js"></script>
  <script src="lib/insights.js"></script>
  <script src="lib/market.js"></script>
  <script src="lib/i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
